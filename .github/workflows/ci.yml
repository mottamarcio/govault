name: CI / Release Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    name: Run Unit Tests & Quality Invariants
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Verify Module Dependencies
        run: go mod verify

      - name: Run Unit Tests with Race Detector
        run: go test -v -race ./...

  build-and-release:
    name: Build Multiplatform Binaries & Create Release
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            suffix: linux-amd64
            ext: ""
          - os: linux
            arch: arm64
            suffix: linux-arm64
            ext: ""
          - os: darwin
            arch: amd64
            suffix: darwin-amd64
            ext: ""
          - os: darwin
            arch: arm64
            suffix: darwin-arm64
            ext: ""
          - os: windows
            arch: amd64
            suffix: windows-amd64
            ext: ".exe"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Build Binary (${{ matrix.os }}/${{ matrix.arch }})
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          OUTPUT_NAME="govault-${{ matrix.suffix }}${{ matrix.ext }}"
          go build -trimpath -ldflags="-s -w" -o "${OUTPUT_NAME}" ./cmd/govault
          gzip -c "${OUTPUT_NAME}" > "${OUTPUT_NAME}.gz" || true
          sha256sum "${OUTPUT_NAME}" > "${OUTPUT_NAME}.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: govault-${{ matrix.suffix }}
          path: |
            govault-${{ matrix.suffix }}${{ matrix.ext }}
            govault-${{ matrix.suffix }}${{ matrix.ext }}.sha256

  publish-release:
    name: Publish GitHub Release (v1.0.0)
    needs: build-and-release
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download All Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release-artifacts
          sha256sum govault-* > SHA256SUMS.txt || true
          ls -lah

      - name: Create or Update Tag & Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.0
          name: "GoVault v1.0.0 — Initial Stable Release"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/govault-*
            release-artifacts/SHA256SUMS.txt
